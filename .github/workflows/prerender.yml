# إعادة بناء الصفحات الثابتة من بيانات المتجر الحية
# يعمل يوميًا، وعند كل رفع لملفات التطبيق، ويمكن تشغيله يدويًا من تبويب Actions
name: Pre-render store pages

on:
  schedule:
    - cron: "0 1 * * *"   # 4 فجرًا بتوقيت السعودية
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "styles.css"
      - "static-pages.css"
      - "tools/**"
      - "site-settings.js"
      - "config.js"

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Pre-render from live data
        run: python tools/build.py --live
      - name: Commit if changed
        run: |
          git config user.name "itqan-prerender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "تحديث تلقائي للصفحات الثابتة من بيانات المتجر"
          git push
